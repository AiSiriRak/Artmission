name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

defaults:
  run:
    working-directory: backend

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/artmission/backend

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: artmission-backend
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --allow-unauthenticated --port=8080 --service-account=${{ vars.GCP_RUN_SERVICE_ACCOUNT }}
          env_vars: |
            APP_ALLOWED_ORIGINS=${{ vars.APP_ALLOWED_ORIGINS }}
            APP_IS_PRODUCTION=true
            AUTH_ACCESS_TOKEN_TTL=${{ vars.AUTH_ACCESS_TOKEN_TTL }}
            AUTH_REFRESH_TOKEN_TTL=${{ vars.AUTH_REFRESH_TOKEN_TTL }}
            AUTH_REFRESH_COOKIE_DOMAIN=${{ vars.AUTH_REFRESH_COOKIE_DOMAIN }}
            S3_PUBLIC_BUCKET_NAME=${{ vars.S3_PUBLIC_BUCKET_NAME }}
            S3_PRIVATE_BUCKET_NAME=${{ vars.S3_PRIVATE_BUCKET_NAME }}
            S3_PUBLIC_BASE_URL=${{ vars.S3_PUBLIC_BASE_URL }}
            S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
            S3_REGION=${{ vars.S3_REGION }}
          secrets: |
            DATABASE_DSN=DATABASE_DSN:latest
            AUTH_JWT_SECRET=AUTH_JWT_SECRET:latest
            S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID:latest
            S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY:latest
