name: Reset Production Data

# DESTRUCTIVE: empties both production S3 buckets and rolls back + re-applies
# every database migration. Manual only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "reset-production" to wipe all production data
        type: string
        required: true

# Same group as the deploy so a wipe never overlaps a rollout; queued, not cancelled.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  reset:
    name: Wipe S3 buckets and reset database
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "reset-production" ]; then
            echo "::error::Confirmation text does not match; nothing was changed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Reset
        env:
          DATABASE_DSN: ${{ secrets.DATABASE_DSN }}
          S3_PUBLIC_BUCKET_NAME: ${{ vars.S3_PUBLIC_BUCKET_NAME }}
          S3_PRIVATE_BUCKET_NAME: ${{ vars.S3_PRIVATE_BUCKET_NAME }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: go run . reset --yes
