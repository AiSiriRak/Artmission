app:
  address: ":8080"
  base_path: "/api/v1"
  allowed_origins: ["http://localhost:3000"]
  is_production: false

database:
  dsn: "postgres://user:password@localhost:5432/artmission?sslmode=disable"

auth:
  jwt_secret: "change-me-to-a-long-random-string"
  access_token_ttl: "1h"
  refresh_token_ttl: "168h" # 7 days
  refresh_cookie_domain: ""

s3:
  public_bucket_name: "artmission-public"
  private_bucket_name: "artmission-private"
  public_base_url: "http://localhost:9000/artmission-public"
  endpoint: "http://localhost:9000"
  region: auto
  access_key_id: "admin"
  secret_access_key: "admin1234"
