info:
  name: GetAccount
  type: http
  seq: 1
  tags:
    - users

http:
  method: GET
  url: "{{api_url}}/users/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/users/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "id": "",
            "username": "",
            "email": "",
            "role": "",
            "profile_image_url": null
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/users/me"
      method: GET
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: Get the authenticated user's account information.
