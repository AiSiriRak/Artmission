info:
  name: DeleteAccount
  type: http
  seq: 4
  tags:
    - users

http:
  method: DELETE
  url: "{{api_url}}/users/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("access_token", "")

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Soft-delete the authenticated account, remove its bank account, and invalidate all sessions. Accounts with pending, unpaid, or in-progress orders cannot be deleted.
