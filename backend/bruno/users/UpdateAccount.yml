info:
  name: UpdateAccount
  type: http
  seq: 2
  tags:
    - users

http:
  method: PUT
  url: "{{api_url}}/users/me"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "username": "updated-name",
        "old_password": "{{password}}",
        "new_password": "different2"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Update the authenticated user's username and optionally change their password. Omit both password fields for a username-only update.
