info:
  name: Logout
  type: http
  seq: 2
  tags:
    - auth

http:
  method: POST
  url: "{{api_url}}/auth/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("access_token", "")

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{api_url}}/auth/logout"
      method: POST
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/auth/logout"
      method: POST
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: Log out and terminate the current session
