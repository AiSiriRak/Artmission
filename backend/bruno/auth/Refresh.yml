info:
  name: Refresh
  type: http
  seq: 3
  tags:
    - auth

http:
  method: POST
  url: "{{api_url}}/auth/refresh"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("access_token", res.body.access_token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/auth/refresh"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "access_token": ""
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/auth/refresh"
      method: POST
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: Exchange a refresh token (cookie) for a new access token
