info:
  name: Login
  type: http
  seq: 1
  tags:
    - auth

http:
  method: POST
  url: "{{api_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("access_token", res.body.access_token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "password": "",
            "username": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "access_token": ""
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "password": "",
            "username": ""
          }
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

