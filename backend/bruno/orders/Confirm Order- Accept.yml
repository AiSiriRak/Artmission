info:
  name: "Confirm Order: Accept"
  type: http
  seq: 5

http:
  method: PUT
  url: "{{api_url}}/orders/:id/confirm"
  params:
    - name: id
      value: "{{OrderID}}"
      type: path
      description: Order ID
  body:
    type: json
    data: |-
      {
        "accept": true
      }
  auth: inherit

runtime:
  variables:
    - name: OrderID
      value: 88f74cd2-76c9-4440-968d-b8eb0bd887ce

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
