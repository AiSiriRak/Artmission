info:
  name: "ConfirmDeliverable: Reject"
  type: http
  seq: 10
  tags:
    - orders

http:
  method: PUT
  url: "{{api_url}}/orders/:id/deliverables/:deliverables_id/confirm"
  params:
    - name: id
      value: "{{OrderID}}"
      type: path
      description: Order ID
    - name: deliverables_id
      value: "{{DeliverableID}}"
      type: path
      description: Deliverable ID
  body:
    type: json
    data: |-
      {
        "accept": false,
        "comment": "again"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

