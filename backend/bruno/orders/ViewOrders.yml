info:
  name: ViewOrders
  type: http
  seq: 1
  tags:
    - orders

http:
  method: GET
  url: "{{api_url}}/orders?limit=20&offset=0&status=PENDING&status=IN_PROCESS&sort=updated_at&order=desc"
  auth: inherit

params:
  query:
    - name: limit
      value: "20"
      enabled: true
    - name: offset
      value: "0"
      enabled: true
    - name: status
      value: PENDING
      enabled: true
    - name: status
      value: IN_PROCESS
      enabled: true
    - name: sort
      value: updated_at
      enabled: true
    - name: order
      value: desc
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/orders"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "orders": "",
            "total": 0
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/orders"
      method: GET
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: |-
  List the authenticated customer's or artist's orders — scoped to whichever
  side of the order they are (customer_id or artist_id), filtered by one or
  more repeated `status` values (OR'd), sorted by `deadline`/`price`/`updated_at`
  in `asc`/`desc` order, and paginated by `limit`/`offset`.

  The response includes `total`, the number of orders matching the filter
  across every page — use it with `limit`/`offset` to build page-number
  navigation. See docs/view-orders-api-plan.md for the full contract.
