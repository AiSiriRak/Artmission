info:
  name: Submit Order Deliverable
  type: http
  seq: 7

http:
  method: POST
  url: "{{api_url}}/orders/:id/deliverables"
  params:
    - name: id
      value: "{{OrderID}}"
      type: path
      description: Order ID
  body:
    type: multipart-form
    data:
      - name: deliverable_image
        type: file
        value:
          - "{{deliverable_image_path}}"
        contentType: image/jpeg
        description: Deliverable Image
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

