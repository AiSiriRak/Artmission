info:
  name: GetArtistProfile
  type: http
  seq: 1
  tags:
    - artists

http:
  method: GET
  url: "{{api_url}}/artists/:id"
  params:
    - name: id
      value: "{{ArtistID}}"
      type: path
      description: Artist User ID
  auth: inherit

runtime:
  variables:
    - name: ArtistID
      value: 1455c1b8-a858-4096-bac0-d6729fab1f20

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/artists/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Artist User ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "artist_id": "",
            "artist_name": "",
            "profile_url": null,
            "description": "",
            "categories": [],
            "styles": [],
            "min_price_satang": 0,
            "max_price_satang": 0,
            "review_score": null,
            "reviews": [],
            "total": 0
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/artists/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Artist User ID
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: Get a public artist profile by artist user ID, including artwork-derived metadata and paginated reviews.
