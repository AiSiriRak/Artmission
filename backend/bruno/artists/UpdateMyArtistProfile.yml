info:
  name: UpdateMyArtistProfile
  type: http
  seq: 2
  tags:
    - artists

http:
  method: PUT
  url: "{{api_url}}/artists/me"
  body:
    type: json
    data: |-
      {
        "style_ids": [],
        "min_price_satang": 10000,
        "max_price_satang": 50000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Replace the authenticated artist's description, selected styles, and accepted price range.
