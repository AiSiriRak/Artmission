info:
  name: UpdateMyArtistProfile
  type: http
  seq: 2
  tags:
    - artists

http:
  method: PUT
  url: "{{api_url}}/artists/me"
  body:
    type: multipart-form
    data:
      - name: description
        type: text
        value: I create expressive digital portraits.
        contentType: text/plain
      - name: profile_image
        type: file
        value: []
        contentType: image/png
        disabled: true
      - name: remove_profile_image
        type: text
        value: "true"
        contentType: text/plain
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/artists/me"
      method: PUT
      body:
        type: multipart-form
        data:
          - name: description
            type: text
            value: ""
            contentType: text/plain
          - name: profile_image
            type: file
            value: []
            contentType: image/png
          - name: remove_profile_image
            type: text
            value: ""
            contentType: text/plain
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "artist_id": "",
            "artist_name": "",
            "profile_url": null,
            "description": "",
            "categories": [],
            "styles": [],
            "min_price_satang": 0,
            "max_price_satang": 0,
            "review_score": null,
            "reviews": [],
            "total": 0
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/artists/me"
      method: PUT
      body:
        type: multipart-form
        data:
          - name: description
            type: text
            value: ""
            contentType: text/plain
          - name: profile_image
            type: file
            value: []
            contentType: image/png
          - name: remove_profile_image
            type: text
            value: ""
            contentType: text/plain
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: |-
  Update the authenticated artist's description or public profile image.

  Select a JPEG, PNG, or WebP file for `profile_image` to upload it. Enable
  `remove_profile_image` instead to remove the current image; the two fields
  cannot be sent together. Omitted fields preserve their current values.
