info:
  name: GetArtistArtworks
  type: http
  seq: 4
  tags:
    - artworks
    - artists

http:
  method: GET
  url: "{{api_url}}/artists/:id/artworks"
  params:
    - name: id
      value: "{{ArtistID}}"
      type: path
      description: Artist User ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/artists/:id/artworks"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Artist User ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "artworks": []
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/artists/:id/artworks"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Artist User ID
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: Get every public artwork created by an artist, newest first.
