info:
  name: GetArtistArtworks
  type: http
  seq: 3
  tags:
    - artworks
    - artists

http:
  method: GET
  url: "{{api_url}}/artists/{{artist_id}}/artworks"

runtime:
  variables:
    - name: artist_id
      value: cefb87a2-d8c2-46bd-b68f-420bb1a8da97

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get every public artwork created by an artist, newest first.
