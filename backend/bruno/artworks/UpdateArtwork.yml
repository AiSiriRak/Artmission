info:
  name: UpdateArtwork
  type: http
  seq: 2
  tags:
    - artworks

http:
  method: PUT
  url: "{{api_url}}/artworks/:id"
  params:
    - name: id
      value: "{{ArtworkID}}"
      type: path
      description: Artwork ID
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Updated illustration
        contentType: text/plain
      - name: category_id
        type: text
        value: "{{CategoryID}}"
        contentType: text/plain
      - name: style_ids
        type: text
        value: '["{{StyleID}}"]'
        contentType: application/json
      - name: description
        type: text
        value: An updated watercolor illustration commission.
        contentType: text/plain
      - name: uploaded_samples
        type: file
        value: []
        contentType: image/png
        disabled: true
      - name: deleted_sample_urls
        type: text
        value: "[]"
        contentType: application/json
      - name: minimum_deadline_days
        type: text
        value: "10"
        contentType: text/plain
      - name: price_satang
        type: text
        value: "75000"
        contentType: text/plain
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

