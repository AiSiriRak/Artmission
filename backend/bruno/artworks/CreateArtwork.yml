            contentType: text/plain
          - name: artwork_samples
            type: file
            value: []
            contentType: image/png
          - name: minimum_deadline_days
            type: text
            value: ""
            contentType: text/plain
          - name: price_satang
            type: text
            value: ""
            contentType: text/plain
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: |-
  Create artist-owned artwork. Select one or more JPEG, PNG, or WebP files
  using repeated `artwork_samples` fields. Each image may be up to 5 MiB.
