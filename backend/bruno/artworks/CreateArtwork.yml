info:
  name: CreateArtwork
  type: http
  seq: 1
  tags:
    - artworks

http:
  method: POST
  url: "{{api_url}}/artworks"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Frontend draft
        contentType: text/plain
      - name: category
        type: text
        value: Illustration
        contentType: text/plain
      - name: styles
        type: text
        value: '["Watercolor"]'
        contentType: application/json
      - name: description
        type: text
        value: A watercolor illustration commission.
        contentType: text/plain
      - name: artwork_samples
        type: file
        value: []
        contentType: image/png
        disabled: true
      - name: minimum_deadline_days
        type: text
        value: "14"
        contentType: text/plain
      - name: price_satang
        type: text
        value: "50000"
        contentType: text/plain
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Create artist-owned artwork. Select one or more JPEG, PNG, or WebP files
  using repeated `artwork_samples` fields. Each image may be up to 5 MiB.
