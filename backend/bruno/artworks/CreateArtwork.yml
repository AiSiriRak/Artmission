info:
  name: CreateArtwork
  type: http
  seq: 1
  tags:
    - artworks

http:
  method: POST
  url: "{{api_url}}/artworks"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Frontend draft
        contentType: text/plain
      - name: category_id
        type: text
        value: "{{CategoryID}}"
        contentType: text/plain
      - name: style_ids
        type: text
        value: '["{{StyleID}}"]'
        contentType: application/json
      - name: description
        type: text
        value: A watercolor illustration commission.
        contentType: text/plain
      - name: artwork_samples
        type: file
        value: []
        contentType: image/png
        disabled: true
      - name: minimum_deadline_days
        type: text
        value: "14"
        contentType: text/plain
      - name: price_satang
        type: text
        value: "50000"
        contentType: text/plain
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{api_url}}/artworks"
      method: POST
      body:
        type: multipart-form
        data:
          - name: name
            type: text
            value: ""
            contentType: text/plain
          - name: category_id
            type: text
            value: ""
            contentType: text/plain
          - name: style_ids
            type: text
            value: ""
            contentType: application/json
          - name: description
            type: text
            value: ""
            contentType: text/plain
          - name: artwork_samples
            type: file
            value: []
            contentType: image/png
          - name: minimum_deadline_days
            type: text
            value: ""
            contentType: text/plain
          - name: price_satang
            type: text
            value: ""
            contentType: text/plain
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "id": "",
            "artist_id": "",
            "name": "",
            "category": "",
            "styles": [],
            "description": "",
            "artwork_samples": [],
            "minimum_deadline_days": 0,
            "price_satang": 0,
            "created_at": "",
            "updated_at": ""
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/artworks"
      method: POST
      body:
        type: multipart-form
        data:
          - name: name
            type: text
            value: ""
