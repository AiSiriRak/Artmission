info:
  name: SearchArtworks
  type: http
  seq: 5
  tags:
    - artworks

http:
  method: GET
  url: "{{api_url}}/artworks"
  params:
    - name: q
      value: Ada
      type: query
      disabled: true
    - name: category
      value: Portrait
      type: query
      disabled: true
    - name: style
      value: Realism
      type: query
      disabled: true
    - name: min_price_satang
      value: "1000"
      type: query
      disabled: true
    - name: max_price_satang
      value: "90000"
      type: query
      disabled: true
    - name: min_review_score
      value: "4"
      type: query
      disabled: true
    - name: sort
      value: name_asc
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{api_url}}/artworks"
      method: GET
      params:
        - name: sort
          value: name_asc
          type: query
        - name: page
          value: "1"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "artworks": [],
            "total": 0,
            "page": 0
          }
  - name: default Response
    description: Error
    request:
      url: "{{api_url}}/artworks"
      method: GET
      params:
        - name: sort
          value: name_asc
          type: query
        - name: page
          value: "1"
          type: query
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "$schema": "",
            "detail": "",
            "errors": "",
            "instance": "",
            "status": 0,
            "title": "",
            "type": ""
          }

docs: Search artworks for the logged-in home page by artist name, optional filters, sort, and page. Empty matches return an empty array.
